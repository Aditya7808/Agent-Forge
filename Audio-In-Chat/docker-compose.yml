# Local stack: Streamlit app + persistent Qdrant.
# Usage:
#   1. Copy .env.example to .env and fill in OPENAI_API_KEY
#   2. docker compose up --build
#   3. Open http://localhost:8501

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: audio_chat_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: audio_chat_app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
    ports:
      - "8501:8501"

volumes:
  qdrant_storage:
