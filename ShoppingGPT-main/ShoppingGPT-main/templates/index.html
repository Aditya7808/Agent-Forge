<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShoppingGPT - AI Fashion Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <span class="logo-text">ShoppingGPT</span>
        </div>
      </div>

      <button class="new-chat-btn" onclick="clearChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New conversation
      </button>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Quick actions</div>
        <button class="nav-item" onclick="sendQuick('Show me all products')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 00-8 0v2"/></svg>
          Browse products
        </button>
        <button class="nav-item" onclick="sendQuick('What is your return policy?')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Return policy
        </button>
        <button class="nav-item" onclick="sendQuick('What payment methods do you accept?')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Payment info
        </button>
        <button class="nav-item" onclick="sendQuick('How long does shipping take?')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          Shipping details
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="powered-by">Powered by OpenAI GPT-4o-mini</div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="main-header">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="header-info">
          <h1>ShoppingGPT</h1>
          <span class="header-status">
            <span class="status-dot"></span>
            Online
          </span>
        </div>
      </header>

      <div class="chat-container" id="chatContainer">
        <!-- Welcome screen -->
        <div class="welcome" id="welcome">
          <div class="welcome-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
          </div>
          <h2>Welcome to ShoppingGPT</h2>
          <p>Your AI-powered fashion shopping assistant. Ask about products, prices, sizes, store policies, or just chat!</p>
          <div class="welcome-chips">
            <button class="chip" onclick="sendQuick('What dresses do you have under 1,000,000₫?')">Dresses under 1M₫</button>
            <button class="chip" onclick="sendQuick('Show me unisex clothing options')">Unisex clothing</button>
            <button class="chip" onclick="sendQuick('Tìm áo khoác da nam')">Leather jackets</button>
            <button class="chip" onclick="sendQuick('What are your best sellers?')">Best sellers</button>
          </div>
        </div>

        <!-- Messages will be inserted here -->
        <div class="messages" id="messages"></div>
      </div>

      <!-- Input area -->
      <div class="input-area">
        <form class="input-form" id="chatForm" onsubmit="return handleSubmit(event)">
          <div class="input-wrapper">
            <textarea
              id="userInput"
              placeholder="Ask about products, sizes, prices, or policies..."
              rows="1"
              autocomplete="off"
              onkeydown="handleKeydown(event)"
              oninput="autoResize(this)"
            ></textarea>
            <button type="submit" class="send-btn" id="sendBtn" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
          <div class="input-hint">Press Enter to send, Shift+Enter for new line</div>
        </form>
      </div>
    </main>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const messagesEl = document.getElementById('messages');
    const welcomeEl = document.getElementById('welcome');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatForm = document.getElementById('chatForm');
    let isLoading = false;

    userInput.addEventListener('input', () => {
      sendBtn.disabled = !userInput.value.trim() || isLoading;
    });

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (userInput.value.trim() && !isLoading) {
          chatForm.dispatchEvent(new Event('submit'));
        }
      }
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function formatMessage(text) {
      let formatted = text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');

      formatted = formatted.replace(
        /(\d{1,3}(?:,\d{3})*(?:\.\d+)?)\s*₫/g,
        '<span class="price-tag">$1₫</span>'
      );
      return formatted;
    }

    function addMessage(text, sender, routeType) {
      welcomeEl.style.display = 'none';
      messagesEl.style.display = 'flex';

      const msg = document.createElement('div');
      msg.className = `message message-${sender}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = sender === 'user'
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      if (sender === 'bot' && routeType) {
        const badge = document.createElement('span');
        badge.className = `route-badge badge-${routeType}`;
        badge.textContent = routeType === 'products' ? 'Product Search' : routeType === 'chitchat' ? 'Chat' : routeType;
        bubble.appendChild(badge);
      }

      const content = document.createElement('div');
      content.className = 'msg-content';
      content.innerHTML = sender === 'user' ? text.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>') : formatMessage(text);
      bubble.appendChild(content);

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      bubble.appendChild(time);

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      scrollToBottom();
      return msg;
    }

    function addTypingIndicator() {
      const msg = document.createElement('div');
      msg.className = 'message message-bot';
      msg.id = 'typing';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble typing-bubble';
      bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function sendMessage(text) {
      if (!text.trim() || isLoading) return;
      isLoading = true;
      sendBtn.disabled = true;

      addMessage(text, 'user');
      addTypingIndicator();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        removeTypingIndicator();

        if (data.error) {
          addMessage('Something went wrong. Please try again.', 'bot', 'error');
        } else {
          addMessage(data.response, 'bot', data.type);
        }
      } catch (err) {
        removeTypingIndicator();
        addMessage('Unable to connect to the server. Please check your connection.', 'bot', 'error');
      } finally {
        isLoading = false;
        sendBtn.disabled = !userInput.value.trim();
      }
    }

    function handleSubmit(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return false;
      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;
      sendMessage(text);
      return false;
    }

    function sendQuick(text) {
      userInput.value = text;
      sendMessage(text);
      userInput.value = '';
    }

    function clearChat() {
      messagesEl.innerHTML = '';
      messagesEl.style.display = 'none';
      welcomeEl.style.display = 'flex';
      userInput.value = '';
      userInput.focus();
    }

    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('open');
    }

    userInput.focus();
  </script>
</body>
</html>
